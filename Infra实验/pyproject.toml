[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-practice-lab"
version = "0.1.0"
description = "Kernel exercises, correctness checks, and reproducible benchmarks"
requires-python = ">=3.11"
dependencies = ["torch==2.9.1", "numpy==2.2.6"]

[project.optional-dependencies]
triton = ["triton-windows==3.5.1.post24; sys_platform == 'win32'", "triton==3.5.1; sys_platform == 'linux'"]

[project.scripts]
kernellab = "kernellab.cli:main"

[tool.setuptools.packages.find]
include = ["kernellab*", "exercises*"]
